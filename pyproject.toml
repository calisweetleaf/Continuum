[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherry-ttt"
version = "0.2.0"
description = "Test-time tooling: environment-trajectory search on a typed contract surface."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
cherry-ttt = "cherry_ttt.cli:main"

[project.optional-dependencies]
archive = ["httpx>=0.24"]
dev = ["ruff", "mypy"]
